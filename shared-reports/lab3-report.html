      for (let n = 1; n < intervals.length; n++) requireValue(intervals[n][0] >= intervals[n - 1][1], `Overlapping intervals in ${session.label}.`);

}
// A session's first message and last reply: the declared start/end, else the edge of its intervals.

function combine(reports) {

  const first = reports[0];

  requireValue(reports.every(r => r.example === first.example), 'Do not combine the fictional example with collected data.');

// Idle: the agent had replied and no new task had come yet, i.e. the gaps between a session's intervals.
function idleGaps(session) {

function totals(sessions) {

// Average number of agents working at any moment: working minutes over the lab window.
function utilization(sessions, duration) { return (totals(sessions).working / (duration / 60000)).toFixed(1); }
function el(tag, content, className) { const node = document.createElement(tag); if (content !== undefined) node.textContent = content; if (className) node.className = className; return node; }
function section(root, title) { const s = el('section'); s.append(el('h2', title)); root.append(s); return s; }
function stat(parent, value, label) { const s = el('div', undefined, 'stat'); s.append(el('b', value), el('span', label)); parent.append(s); }
function render(data) {
  const root = document.getElementById('report'); root.replaceChildren();
  const start = stamp(data.lab.start), duration = stamp(data.lab.end) - start;
  const minute = t => ((stamp(t) - start) / 60000).toFixed(1);
  document.getElementById('window').textContent = `${data.laptops.map(l => l.student).join(' + ')} · ${new Date(start).toISOString()} · ${Math.round(duration / 60000)} minutes`;
  if (data.example) root.append(el('p', 'FICTIONAL EXAMPLE — these sessions and timings only show the format. Load your own exports to replace them.', 'banner'));

  const glance = section(root, 'Agent time');
  for (const laptop of data.laptops) {
    const sum = totals(laptop.sessions);
    glance.append(el('h3', laptop.student));
    const stats = el('div', undefined, 'stats'); glance.append(stats);
    stat(stats, `${sum.working.toFixed(0)} min`, 'agent working');
    stat(stats, `${sum.waiting.toFixed(0)} min`, 'agent waiting for an answer');
    stat(stats, `${sum.idle.toFixed(0)} min`, 'agent idle, waiting for the next task');

    stat(stats, String(laptop.sessions.length), 'sessions');
  }
  const pair = utilization(data.laptops.flatMap(l => l.sessions), duration);
  glance.append(el('p', `Across ${data.laptops.length === 1 ? 'this laptop' : 'the pair'}, ${pair} agents were working at any moment on average. Working runs from your message to the agent’s reply, tools included. Waiting is the agent asking you something until you answered. Idle is the agent done with one task and waiting for you to give it the next one, up to your next message. Minutes are summed over sessions, so two agents at once count twice; the average divides that sum by the whole lab window.`, 'muted'));

  const timeline = section(root, 'Timeline'), legend = el('div', undefined, 'legend'); timeline.append(legend);
  for (const [state, label] of [['working', 'Agent working'], ['waiting', 'Waiting for an answer'], ['idle', 'Idle: waiting for the next task']]) { const item = el('span'); item.append(el('i', undefined, `key ${state}`), document.createTextNode(label)); legend.append(item); }
  for (const laptop of data.laptops) {
    timeline.append(el('h3', laptop.student));
    const scroll = el('div', undefined, 'scroll'), chart = el('div', undefined, 'timeline'), axis = el('div', undefined, 'axis'), ticks = el('div', undefined, 'ticks');
    axis.append(el('span', 'Minutes since lab start'), ticks); for (let n = 0; n <= 6; n++) ticks.append(el('span', String(Math.round(duration / 60000 * n / 6)))); chart.append(axis); scroll.append(chart); timeline.append(scroll);
    if (!laptop.sessions.length) chart.append(el('p', 'No sessions recorded; see the notes below.'));

      const [first, last] = span(s), at = t => ((t - start) / duration * 100), min = t => ((t - start) / 60000).toFixed(1);
      label.append(el('small', `${s.parent ? `${s.tool} · subagent of ${s.parent}` : s.tool} · min ${min(first)}–${min(last)}`)); row.append(label, track); chart.append(row);
      const line = el('div', undefined, 'span'); line.style.left = at(first) + '%'; line.style.width = (at(last) - at(first)) + '%'; track.append(line);
      for (const [t, what] of [[first, 'first message'], [last, 'last recorded message']]) {
        const mark = el('div', undefined, 'mark'); mark.style.left = `min(${at(t)}%, calc(100% - 3px))`; mark.title = `${s.label}: ${what}, minute ${min(t)}`; mark.setAttribute('aria-label', mark.title); track.append(mark);
      }
      for (const [a, b] of idleGaps(s)) {
        const bar = el('div', undefined, 'interval idle');
        bar.style.left = ((a - start) / duration * 100) + '%'; bar.style.width = ((b - a) / duration * 100) + '%';
        bar.title = `${s.label}: idle, minute ${((a - start) / 60000).toFixed(1)}–${((b - start) / 60000).toFixed(1)}`; bar.setAttribute('aria-label', bar.title); track.append(bar);
      }
      for (const i of s.intervals) {
        const bar = el('div', undefined, `interval ${i.state}`);
        bar.style.left = ((stamp(i.start) - start) / duration * 100) + '%'; bar.style.width = ((stamp(i.end) - stamp(i.start)) / duration * 100) + '%';
        bar.title = `${s.label}: ${i.state}, minute ${minute(i.start)}–${minute(i.end)}`; bar.setAttribute('aria-label', bar.title); track.append(bar);
      }
    }
  }

  const commits = section(root, 'History graph');
  const histories = data.laptops.filter(l => l.history && l.history.trim());
  const distinct = [...new Set(histories.map(l => l.history.trim()))];
  if (!histories.length) commits.append(el('p', 'No history graph recorded.'));
  else if (distinct.length === 1) commits.append(tree(distinct[0]));
  else for (const l of histories) commits.append(el('h3', `As seen from ${l.student}’s clone`), tree(l.history.trim()));
  commits.append(el('p', 'Output of git log --graph --oneline --decorate --all at the end of the lab, coloured as in the terminal: hashes yellow, HEAD cyan, local branches green, remote branches red.', 'muted'));

  const story = section(root, 'What we did');
  for (const l of data.laptops) {
    const block = el('div', undefined, 'student'); block.append(el('h3', l.student), el('p', l.summary));
    if (l.observations.length) { const ul = el('ul'); l.observations.forEach(t => ul.append(el('li', t))); block.append(ul); }
    if (l.notes && l.notes.trim()) block.append(el('p', `Notes: ${l.notes}`, 'muted'));
    story.append(block);
  }
}
// The history graph, coloured. Terminal escape codes (git log --color=always) are honoured;
// plain output is coloured the way git colours it: graph lanes cycling, hash yellow,
// HEAD cyan, local branches green, remote branches red, tags yellow.
const LANES = ['c31', 'c32', 'c33', 'c34', 'c35', 'c36'];
function tree(source) {
  const pre = el('pre');
  const piece = (t, cls) => { const s = el('span', t, cls); pre.append(s); };
  if (/\x1b\[/.test(source)) {
    let cls = '';
    for (const part of source.split(/(\x1b\[[0-9;]*m)/)) {
      const code = part.match(/^\x1b\[([0-9;]*)m$/);
      if (!code) { if (part) piece(part, cls || undefined); continue; }
      for (const n of (code[1] || '0').split(';')) {
        if (n === '0' || n === '' || n === '39') cls = '';
        else if (n === '1') cls = (cls + ' bold').trim();
        else if (/^3[0-7]$/.test(n)) cls = 'c' + n;
        else if (/^9[0-7]$/.test(n)) cls = 'c3' + n[1];
      }
    }
    return pre;
  }
  source.split('\n').forEach((line, index) => {
    if (index) pre.append(document.createTextNode('\n'));
    const m = line.match(/^([ *|\/\\_.-]*?)([0-9a-f]{7,40})( \((.*?)\))?(.*)$/);
    const graph = m ? m[1] : line;
    [...graph].forEach((ch, col) => piece(ch, ch === ' ' ? undefined : LANES[Math.floor(col / 2) % LANES.length]));
    if (!m) return;
    piece(m[2], 'c33');
    if (m[3]) {
      piece(' (');
      m[4].split(', ').forEach((ref, i) => {
        if (i) piece(', ');
        if (ref.startsWith('HEAD -> ')) { piece('HEAD -> ', 'c36 bold'); piece(ref.slice(8), 'c32 bold'); }
        else if (ref.startsWith('tag: ')) piece(ref, 'c33 bold');
        else if (ref.includes('/')) piece(ref, 'c31 bold');

function download(name, content, type) { const url = URL.createObjectURL(new Blob([content], { type })), a = el('a'); a.href = url; a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); }
let current;
try { current = validate(JSON.parse(document.getElementById('report-data').textContent)); render(current); } catch (error) { document.getElementById('error').textContent = error.message; }
document.getElementById('files').addEventListener('change', async event => {
  if (!event.target.files.length) return;
  try { const parsed = await Promise.all([...event.target.files].map(async f => JSON.parse(await f.text()))); current = combine(parsed); render(current); document.getElementById('error').textContent = ''; }
  catch (error) { document.getElementById('error').textContent = error.message; }
  event.target.value = '';
});
document.getElementById('save-html').onclick = () => {
  if (!current) return;
  const copy = document.documentElement.cloneNode(true);
  copy.querySelector('#report-data').textContent = JSON.stringify(current).replace(/</g, '\\u003c');
  copy.querySelector('#report').replaceChildren(); copy.querySelector('#error').textContent = ''; copy.querySelector('#window').textContent = '';
  download('lab03-report.html', '<!doctype html>\n' + copy.outerHTML, 'text/html');
};
